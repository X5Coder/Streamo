<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 288" width="512" height="512">
  <defs>
    <linearGradient id="blackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F04545"/>
      <stop offset="1" stop-color="#A00000"/>
    </linearGradient>
    <radialGradient id="globeGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#5DB6FF"/>
      <stop offset="0.6" stop-color="#1384F0"/>
      <stop offset="1" stop-color="#0757B8"/>
    </radialGradient>
    <clipPath id="globeClip"><circle r="34"/></clipPath>
    <clipPath id="weave"><circle cx="115" cy="133" r="17"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="288" height="288" rx="44" ry="44" fill="#ffffff"/>

  <g transform="translate(144 144) scale(1.3) translate(-129.35 -148.35)">

  <g stroke="#C00000" stroke-width="7" stroke-linecap="round">
    <line x1="48" y1="121" x2="70" y2="124"/>
    <line x1="62" y1="86" x2="80" y2="101"/>
    <line x1="99" y1="70" x2="101" y2="91"/>
  </g>

  <g filter="url(#shadow)" fill="none" stroke-width="17">
    <rect id="blackLink" x="75" y="124.500" width="52" height="105" rx="26"
          transform="rotate(45 101 177)" stroke="url(#blackGrad)"/>
    <rect x="135" y="67.500" width="52" height="105" rx="26"
          transform="rotate(45 161 120)" stroke="url(#redGrad)"/>
    <g clip-path="url(#weave)">
      <rect x="75" y="124.500" width="52" height="105" rx="26"
            transform="rotate(45 101 177)" stroke="url(#blackGrad)"/>
    </g>
  </g>

  <g transform="translate(170 192)" filter="url(#shadow)">
    <circle r="38" fill="#fff"/>
    <circle r="34" fill="url(#globeGrad)"/>
    <g clip-path="url(#globeClip)" fill="none" stroke="#fff" stroke-width="2.600" stroke-opacity="0.95">
      <ellipse rx="15" ry="34"/>
      <line x1="0" y1="-34" x2="0" y2="34"/>
      <line x1="-34" y1="0" x2="34" y2="0"/>
      <path d="M-31 -17 Q0 -7 31 -17"/>
      <path d="M-31 17 Q0 7 31 17"/>
    </g>
    <ellipse cx="-12" cy="-16" rx="10" ry="5" fill="#fff" opacity="0.28" transform="rotate(-35 -12 -16)"/>
  </g>
  </g>
</svg>
